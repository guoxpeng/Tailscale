name: 构建安卓汉化 APK

# 这里是安卓侧唯一的构建入口。
# 打 android-v* 标签 → 构建全架构 APK → 发布到 Releases。
# 手动触发（workflow_dispatch）只构建并上传 Actions 产物，不发布 Release。
#
# 发版约定：统一发到 Release 标签 `v<版本号>`（= android/build.gradle 的 versionName）。
# Windows 侧（pc 分支的 build-pc-installer.yml）也写同一个 Release，
# 因此一个 Release 页面里同时有 Android APK 与 Windows 安装包。

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建并发布
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK 与 NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p /opt/android-sdk
          cd /opt/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/latest/
          yes | cmdline-tools/latest/bin/sdkmanager --licenses
          cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "/opt/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "/opt/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH

      # 用仓库里固定的调试密钥签名，而不是每次随机生成：
      # 随机密钥会导致每个版本的签名都不同，用户无法覆盖安装升级。
      # 这是 Android 调试密钥（口令固定为公开的 android），不用于上架，无泄露风险。
      - name: 安装固定调试签名密钥
        run: |
          mkdir -p $HOME/.android
          cp .ci/android-debug.keystore $HOME/.android/debug.keystore
          keytool -list -keystore $HOME/.android/debug.keystore -storepass android | grep androiddebugkey

      - name: 读取版本号
        id: ver
        run: |
          v=$(grep -oP 'versionName\s+"\K[^"]+' android/build.gradle | head -1)
          echo "version=$v" >> $GITHUB_OUTPUT
          echo "本次版本号: $v"

      - name: 清理
        run: make clean

      - name: 构建 libtailscale
        run: make libtailscale

      # 不传 -PslimBuild，即构建全架构（arm64-v8a / armeabi-v7a / x86 / x86_64）。
      - name: 构建全架构 APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cp build/outputs/apk/debug/android-debug.apk "../Tailscale-zh-${{ steps.ver.outputs.version }}.apk"
          ls -lh "../Tailscale-zh-${{ steps.ver.outputs.version }}.apk"

      - name: 校验签名与版本信息
        run: |
          apk="Tailscale-zh-${{ steps.ver.outputs.version }}.apk"
          echo "===== 签名 ====="
          /opt/android-sdk/build-tools/34.0.0/apksigner verify --verbose "$apk"
          echo "===== 包信息 ====="
          /opt/android-sdk/build-tools/34.0.0/aapt dump badging "$apk" \
            | grep -E "^package|^sdkVersion|^targetSdkVersion|^native-code|^application-label:"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-zh-apk-${{ steps.ver.outputs.version }}
          path: Tailscale-zh-${{ steps.ver.outputs.version }}.apk
          retention-days: 30

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 统一发版标签 = v<版本号>。Windows 侧（pc 分支的 build-pc-installer.yml）
          # 也写**同一个** Release，所以一个 Release 页面里同时有 exe 与 apk。
          # 打 android-v* 标签只触发本流水线（Android），它只覆盖 apk，不会动 exe。
          tag_name: v${{ steps.ver.outputs.version }}
          name: Tailscale 汉化版 ${{ steps.ver.outputs.version }}（Windows + Android）
          target_commitish: ${{ github.sha }}
          # 同名资产直接覆盖，方便同版本重跑
          overwrite_files: true
          # 没匹配到 apk 就直接失败，避免静默建出「没有资产」的空更新
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: .github/release-notes.md
          files: Tailscale-zh-${{ steps.ver.outputs.version }}.apk
